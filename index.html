<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f172a">
<title>Operasyon Paneli</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<style>
#gate{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;background:#0f172a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#gate form{background:#fff;padding:30px 26px;border-radius:14px;width:min(340px,88vw);box-shadow:0 20px 50px rgba(0,0,0,.35)}
#gate h1{margin:0 0 4px;font-size:20px}#gate p.s{margin:0 0 18px;color:#64748b;font-size:13px}
#gate label.l{display:block;font-size:12px;color:#475569;margin:10px 0 4px;font-weight:600}
#gate input[type=password]{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
#gate .rm{display:flex;gap:7px;align-items:center;margin-top:12px;font-size:13px;color:#334155}
#gate button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate button:disabled{opacity:.6}#gate .err{color:#b91c1c;font-size:13px;margin-top:10px;min-height:1em}
#gate .lg{width:38px;height:38px;border-radius:9px;background:#1d4ed8;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:12px}
#appRoot{display:none}
</style>
</head>
<body>
<div id="gate"><form id="gf" autocomplete="on"><div class="lg">B</div><h1>Operasyon Paneli</h1><p class="s">Devam etmek için şifreyi gir.</p>
<input type="text" name="username" value="panel" autocomplete="username" style="display:none">
<label class="l" for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" required autofocus>
<label class="rm"><input id="rm" type="checkbox"> Beni hatırla (bu cihazda)</label>
<div class="err" id="ge"></div><button id="gb">Giriş yap</button></form></div>
<div id="appRoot"></div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script>
(function () {
'use strict';
const LS = 'opk1';
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = (u) => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
let KEY = null, SALT = null, FIRST = null;
const RAW = /github\.io$/.test(location.hostname) ? 'https://raw.githubusercontent.com/' + location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1] + '/main/' : null;
async function getFile(name, asText) { const t = '?t=' + Date.now(); const srcs = (RAW ? [RAW + name + t] : []).concat([name + t]); let last; for (const u of srcs) { try { const r = await fetch(u, {cache: 'no-store'}); if (r.ok) return asText ? r.text() : r.json(); last = r.status; } catch (e) { last = e.message; } } throw new Error('Dosya alınamadı: ' + name + ' (' + last + ')'); }
function getEnc() { return getFile('data.enc.json', false); }
async function derive(pw, e, extractable) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', hash: e.hash || 'SHA-256', salt: b64(e.salt), iterations: e.iter}, base, {name: 'AES-GCM', length: 256}, extractable, ['decrypt']);
}
async function gunzip(buf) { const ds = new DecompressionStream('gzip'); return new Response(new Blob([buf]).stream().pipeThrough(ds)).text(); }
async function decrypt(e, key) { const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(e.iv)}, key, b64(e.ct)); return JSON.parse(e.z === 'gzip' ? await gunzip(pt) : new TextDecoder().decode(pt)); }
async function source() {
  if (FIRST) { const d = FIRST; FIRST = null; return d; }
  const e = await getEnc();
  if (e.salt !== SALT) { logout(); throw new Error('Şifre değişti, tekrar giriş yap'); }
  return decrypt(e, KEY);
}
function logout() { try { localStorage.removeItem(LS); } catch (x) {} location.reload(); }
function fill(s, ui) { return s.replace(/\{\{([A-Z]+)\}\}/g, (m, k) => (ui[k] != null ? ui[k] : m)); }
async function start(data) {
  const ui = data.ui || {};
  const [css, js] = await Promise.all([getFile('app.css', true), getFile('app.tpl.js', true)]);
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  document.title = (ui.TITLE || 'Operasyon Paneli');
  const root = document.getElementById('appRoot'); root.innerHTML = ''; root.style.display = 'block'; document.getElementById('gate').remove();
  window.APP_SOURCE = source; window.APP_LOGOUT = logout; FIRST = data;
  const s = document.createElement('script'); s.textContent = fill(js, ui); document.body.appendChild(s);
}
async function tryStored() {
  let st; try { st = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (x) { st = null; }
  if (!st) return false;
  try {
    const e = await getEnc();
    if (e.salt !== st.salt) { localStorage.removeItem(LS); return false; }
    KEY = await crypto.subtle.importKey('raw', b64(st.k), {name: 'AES-GCM'}, false, ['decrypt']); SALT = e.salt;
    await start(await decrypt(e, KEY)); return true;
  } catch (x) { localStorage.removeItem(LS); KEY = null; return false; }
}
document.getElementById('gf').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const pw = document.getElementById('pw').value, rm = document.getElementById('rm').checked, err = document.getElementById('ge'), btn = document.getElementById('gb');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Açılıyor…';
  try {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('Tarayıcı desteklemiyor; güncel Chrome/Safari kullan');
    const e = await getEnc();
    const k = await derive(pw, e, rm);
    let data; try { data = await decrypt(e, k); } catch (x) { throw new Error('Şifre hatalı'); }
    if (rm) { try { localStorage.setItem(LS, JSON.stringify({salt: e.salt, k: ub64(await crypto.subtle.exportKey('raw', k))})); } catch (x) {} }
    KEY = rm ? await crypto.subtle.importKey('raw', await crypto.subtle.exportKey('raw', k), {name: 'AES-GCM'}, false, ['decrypt']) : k; SALT = e.salt;
    await start(data);
  } catch (x) { err.textContent = x.message || String(x); btn.disabled = false; btn.textContent = 'Giriş yap'; }
});
tryStored();
})();
</script>
</body>
</html>
